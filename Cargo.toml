[workspace]
resolver = "2"
members = ["crates/oratio-core", "crates/oratio-audio", "crates/oratio-stt", "crates/oratio-store", "crates/oratio-paste", "crates/oratio-keys", "crates/oratio-window", "crates/oratio-models", "crates/oratio-parakeet", "src-tauri"]
# The Parakeet adapter downloads ONNX Runtime while building, so it is only compiled when asked for.
default-members = ["crates/oratio-core", "crates/oratio-audio", "crates/oratio-stt", "crates/oratio-store", "crates/oratio-paste", "crates/oratio-keys", "crates/oratio-window", "crates/oratio-models", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

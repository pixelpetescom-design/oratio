[workspace]
resolver = "2"
members = ["crates/vox-core", "crates/vox-audio", "crates/vox-stt", "crates/vox-store", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

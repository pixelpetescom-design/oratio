[package]
name = "oratio-stt"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oratio-core = { path = "../oratio-core" }
whisper-rs = "0.16"

[features]
# Run the speech model on the graphics card (Vulkan: NVIDIA, AMD and Intel). Falls back to the CPU
# at runtime if no usable GPU is found.
vulkan = ["whisper-rs/vulkan"]

[lints]
workspace = true

name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      gpu:
        description: "GPU build (Vulkan; NVIDIA/AMD/Intel) with the large, more accurate model"
        type: boolean
        default: true
  push:
    tags: ["v*"]

env:
  # Keep build paths short: the Vulkan shader build nests deeply and hits Windows' 260-character path limit.
  CARGO_TARGET_DIR: D:\t
  GPU: ${{ inputs.gpu && 'true' || 'false' }}

jobs:
  windows:
    # Pinned: windows-latest moved to Visual Studio 18 / CMake 4.4, which broke the GPU build.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false # never reuse old CMake build trees

      - name: Download the speech model (bundled into the installer)
        shell: pwsh
        run: |
          if ($env:GPU -eq "true") { ./scripts/get-model.ps1 -Model large } else { ./scripts/get-model.ps1 }

      - name: Install the Vulkan SDK (GPU build only)
        if: env.GPU == 'true'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "VulkanSDK-Installer.exe"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe" -OutFile $installer
          & $installer --accept-licenses --default-answer --confirm-command install
          $sdk = (Get-ChildItem C:\VulkanSDK | Sort-Object Name -Descending | Select-Object -First 1).FullName
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "$sdk\Bin" >> $env:GITHUB_PATH

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build installer
        shell: pwsh
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          # Don't tune the speech engine to the build machine's CPU (it may not match yours);
          # with this off it targets AVX2/FMA, which every PC from the last decade has.
          GGML_NATIVE: "OFF"
        run: |
          if ($env:GPU -eq "true") { cargo tauri build --features gpu } else { cargo tauri build }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GPU == 'true' && 'Oratio-Windows-GPU-installer' || 'Oratio-Windows-installer' }}
          path: |
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/nsis/*.exe
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Attach to release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/nsis/*.exe
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/msi/*.msi

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vox overlay</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { background: transparent; overflow: hidden; }
    .pill {
      margin: 4px; height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 18px;
      border-radius: 28px; background: rgba(18, 22, 32, 0.72); border: 1px solid rgba(255, 255, 255, 0.18);
    }
    #label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
    #meter { width: 70px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
    #bar { height: 100%; width: 0; background: var(--accent); transition: width 60ms linear; }
  </style>
</head>
<body>
  <div class="pill"><span id="dot" class="dot"></span><span id="label"></span><div id="meter"><div id="bar"></div></div></div>
<script src="overlay.js"></script>
</body>
</html>

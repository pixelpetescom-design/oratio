<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Oratio overlay</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { background: transparent; overflow: hidden; margin: 0; }
    .box { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 8px; }
    canvas { width: 190px; height: 120px; display: block; }
    #label {
      font-size: 13px; font-weight: 500; color: rgba(255, 255, 255, 0.9); white-space: nowrap;
      padding: 3px 12px; border-radius: 999px; background: rgba(14, 18, 28, 0.55); border: 1px solid rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body>
  <div class="box"><canvas id="wave"></canvas><div id="label">Listening…</div></div>
<script src="wave.js"></script>
<script src="overlay.js"></script>
</body>
</html>

[package]
name = "oratio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local, offline push-to-dictate with instant clipboard text"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
oratio-core = { path = "../crates/oratio-core" }
oratio-audio = { path = "../crates/oratio-audio" }
oratio-stt = { path = "../crates/oratio-stt" }
oratio-store = { path = "../crates/oratio-store" }
oratio-paste = { path = "../crates/oratio-paste" }
oratio-keys = { path = "../crates/oratio-keys" }
oratio-window = { path = "../crates/oratio-window" }
oratio-models = { path = "../crates/oratio-models" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }

[features]
# GPU-accelerated speech recognition; build with `cargo tauri build --features gpu`.
gpu = ["oratio-stt/vulkan"]

[lints]
workspace = true
